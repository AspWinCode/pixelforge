name: pixelforge

# Прод-развёртывание PixelForge. Все контейнеры доступны только с localhost;
# наружу проект отдаёт nginx на хосте (см. deploy/nginx/) на домене
# pixelforge.tirskix.space.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pixelforge
      POSTGRES_USER: pixelforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Одноразово создаёт bucket для сабмишенов.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      echo 'minio bucket ready'
      "
    restart: "no"

  backend:
    build:
      context: ./pixelforge-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pixelforge
      DB_USERNAME: pixelforge
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: us-east-1
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN}
      GDEVELOP_ORIGIN: ${GDEVELOP_ORIGIN}
      LMS_WEBHOOK_SECRET: ${LMS_WEBHOOK_SECRET}
      LMS_JWT_SECRET: ${LMS_JWT_SECRET}
      # Интеграция с кабинетом ученика (learning-portal).
      SSO_KODEX_SHARED_SECRET: ${SSO_KODEX_SHARED_SECRET:-}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://tirskix.space}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8180:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: pixelforge-frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_ORIGIN}/api
        VITE_API_ORIGIN: ${PUBLIC_ORIGIN}
        VITE_SNAP_URL: ${PUBLIC_ORIGIN}/snap/snap.html
        VITE_GDEVELOP_URL: ${GDEVELOP_ORIGIN}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8181:80"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
