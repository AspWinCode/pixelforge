# Сохраняем оригинальный протокол, пришедший от внешнего nginx на хосте
# (там https). Если заголовка нет — берём текущую схему.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # Snap! XML-проекты бывают крупными — не режем.
    location /snap/ {
        try_files $uri $uri/ =404;
    }

    # Проксируем API на backend-контейнер внутри compose-сети.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # SPA-роутинг React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
