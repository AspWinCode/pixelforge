spring:
  application:
    name: pixelforge-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/pixelforge
    username: pixelforge
    password: pixelforge
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  session:
    store-type: redis
    redis:
      namespace: pixelforge:session

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG

pixelforge:
  s3:
    endpoint: http://localhost:9000
    bucket: pixelforge-submissions
    access-key: pixelforge
    secret-key: pixelforge123
    region: us-east-1
  frontend:
    origin: http://localhost:5173
  lms:
    webhook-secret: dev-lms-secret-change-me
