spring:
  application:
    name: pixelforge-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pixelforge}
    username: ${DB_USERNAME:pixelforge}
    password: ${DB_PASSWORD:pixelforge}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  session:
    store-type: redis
    redis:
      namespace: pixelforge:session

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG

pixelforge:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:pixelforge-submissions}
    access-key: ${S3_ACCESS_KEY:pixelforge}
    secret-key: ${S3_SECRET_KEY:pixelforge123}
    region: ${S3_REGION:us-east-1}
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  gdevelop:
    origin: ${GDEVELOP_ORIGIN:http://localhost:3500}
  lms:
    webhook-secret: ${LMS_WEBHOOK_SECRET:dev-lms-secret-change-me}
  auth:
    # HS256 shared secret used to verify the LMS SSO launch JWT (POST
    # /api/auth/lms-sso). Must match whatever the LMS side signs with —
    # placeholder below is dev-only, never valid outside this machine.
    lms-jwt-secret: ${LMS_JWT_SECRET:dev-lms-jwt-secret-change-me-please-32bytes-min}
  portal:
    # Интеграция с кабинетом ученика (learning-portal, tirskix.space).
    # sso-shared-secret — общий HS256-секрет (у портала это
    # SSO_KODEX_SHARED_SECRET). Пустой = интеграция выключена.
    sso-shared-secret: ${SSO_KODEX_SHARED_SECRET:}
    base-url: ${PORTAL_BASE_URL:https://tirskix.space}
    catalog-item-code: ${PORTAL_CATALOG_ITEM_CODE:pixelforge}
    sso-audience: ${PORTAL_SSO_AUDIENCE:pixelforge}
