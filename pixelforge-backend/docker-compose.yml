services:
  postgres:
    image: postgres:16
    container_name: pixelforge-postgres
    environment:
      POSTGRES_DB: pixelforge
      POSTGRES_USER: pixelforge
      POSTGRES_PASSWORD: pixelforge
    ports:
      - "5432:5432"
    volumes:
      - pixelforge_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pixelforge-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: pixelforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pixelforge
      MINIO_ROOT_PASSWORD: pixelforge123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pixelforge_minio_data:/data

volumes:
  pixelforge_pg_data:
  pixelforge_minio_data:
